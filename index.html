    <style>
        :root { --b: #00205B; --g: #C69214; --w: #FFF; --s: #F8F6F2; --text: #2D2D2D; --naver: #00C73C; --nav-h: 60px; }
        *{margin:0;padding:0;box-sizing:border-box; scroll-behavior: smooth;}
        body{font-family:'Noto Sans KR',sans-serif;color:var(--text);line-height:1.6;background:#fff;word-break:keep-all; -webkit-text-size-adjust: none;}

        /* [NAV] */
        nav{position:fixed;top:0;width:100%;padding:0 3%;height:var(--nav-h);display:flex;justify-content:space-between;align-items:center;z-index:1000;background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);border-bottom:1px solid #eee}
        .logo{color:var(--b);font-weight:700;font-size:16px;text-decoration:none;}
        .nav-links{list-style:none; display:flex; gap:8px;}
        .nav-links a{text-decoration:none; color:var(--text); font-weight:500; font-size:12px; padding: 5px 2px; white-space: nowrap;}

        /* [OFFSET] */
        #about, #treat, #blog, #info-location { scroll-margin-top: calc(var(--nav-h) + 20px); }

        /* [HERO] */
        .hero{height:45vh; min-height:350px; background:linear-gradient(135deg, #001A4B 0%, #00337C 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--w);text-align:center;padding-top:var(--nav-h);}
        .snu-logo { width: 70px; margin-bottom: 15px; filter: brightness(0) invert(1); }
        .hero h1{font-size:26px; font-weight:700; margin-bottom: 8px;}
        .hero p { font-size: 14px; opacity: 0.9; font-family: 'Playfair Display', serif; font-style: italic;}

        section{padding:60px 20px; max-width:1200px; margin:0 auto}
        .title-wrap{text-align:center; margin-bottom:40px}
        .title-wrap h2{font-size:24px; color:var(--b); font-weight:700;}
        .bar{width:30px; height:2px; background:var(--g); margin:12px auto}
/* 모바일 화면(768px 이하) 대응 */
@media (max-width: 768px) {
    .nav-links {
        gap: 4px;
    }
    .nav-links a {
        font-size: 11px;
        padding: 5px 1px;
    }
}
        /* [의료진] */
        .doc-card { display: flex; flex-direction: column; background: var(--s); border-radius: 25px; overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.07); }
        .doc-img { width: 100%; height: 400px; background: #e1e1e1 url('빠삐다용.png') center top no-repeat; background-size: cover; }
        .doc-info { padding: 40px 25px; }
        .doc-info h3 { font-size: 26px; color: var(--b); margin-bottom: 5px; }
        .doc-info .spec { color: var(--g); font-weight: 700; font-size: 16px; margin-bottom: 25px; display: block; }
        .doc-list li { margin-bottom: 10px; font-size: 14.5px; padding-left: 18px; position: relative; list-style: none; color: #444; }
        .doc-list li::before { content: ''; position: absolute; left: 0; top: 11px; width: 8px; height: 1px; background: var(--g); }

        /* [치료 프로그램 - 1단 아코디언] */
        .treat-accordion { display: flex; flex-direction: column; gap: 15px; max-width: 900px; margin: 0 auto; }
        .cat-item { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; transition: all 0.3s ease; }
        .cat-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; background: #fff; transition: 0.3s; }
        .cat-header:hover { background: var(--s); }
        .cat-header h3 { font-size: 18px; color: var(--b); font-weight: 700; }
        .cat-header .icon { font-size: 20px; color: var(--g); transition: transform 0.3s; }
        
        .cat-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out, padding 0.3s ease; background: #fcfcfc; }
        .cat-item.active .cat-content { max-height: 2500px; padding: 10px 0 25px 0; }
        .cat-item.active .icon { transform: rotate(45deg); }
        .cat-item.active .cat-header { border-bottom: 1px solid #f0f0f0; }

        /* [치료 프로그램 - 2단 세부 아코디언] */
        .sub-accordion { display: flex; flex-direction: column; }
        .sub-item { border-bottom: 1px solid #eee; }
        .sub-item:last-child { border-bottom: none; }
        .sub-header { padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s; background: transparent; }
        .sub-header:hover { background: #f9f9f9; }
        .sub-header-text { font-size: 15px; color: #444; font-weight: 500; display: flex; align-items: center; }
        .sub-header-text::before { content: "•"; color: var(--g); font-weight: bold; margin-right: 8px; font-size: 18px; }
        .sub-icon { font-size: 12px; color: #aaa; transition: transform 0.3s; }
        
        .sub-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease, margin 0.3s ease; background: #fff; border-radius: 12px; margin: 0 25px; }
        .sub-item.active .sub-content { max-height: 800px; padding: 20px; margin-bottom: 15px; border: 1px solid #eaeaea; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .sub-item.active .sub-header-text { color: var(--b); font-weight: 700; }
        .sub-item.active .sub-icon { transform: rotate(180deg); color: var(--b); }

        .detail-img { width: 100%; height: auto; max-height: 350px; object-fit: contain; border-radius: 8px; margin-bottom: 15px; display: block; }
        .detail-text { font-size: 14px; color: #555; line-height: 1.6; word-break: keep-all; }

        /* [블로그] */
        .blog-list { display: flex; flex-direction: column; gap: 30px; }
        .blog-post { text-decoration: none; color: inherit; display: block; padding-bottom: 25px; border-bottom: 1px solid #eee; }
        .blog-post .category { font-size: 12px; color: var(--g); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: block; }
        .blog-post h3 { font-size: 20px; color: var(--b); margin-bottom: 12px; font-weight: 700; line-height: 1.4; }
        .blog-post p { font-size: 14.5px; color: #666; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* [진료/위치] */
        .info-location-wrapper { display: flex; flex-direction: column; gap: 30px; }
        .info-box { background: var(--s); padding: 35px 25px; border-radius: 20px; border: 1px solid #e1d8c1; }
        .info-box b { font-size: 22px; color: var(--b); display: block; margin-bottom: 20px; }
        .time-table { border-top: 1px solid rgba(0,0,0,0.05); padding-top: 20px; }
        .time-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; }
        .tel { font-size: 28px; color: var(--b); font-weight: 700; text-decoration: none; display: block; margin-top: 15px; text-align: center;}
        
        .map-wrapper { display: flex; flex-direction: column; gap: 15px; }
        .map-desc { background: #fff; padding: 20px; border-radius: 15px; border: 1px solid #eee; }
        .map-desc h4 { color: var(--b); font-size: 16px; margin-bottom: 8px; }
        .map-desc p { font-size: 14px; color: #666; line-height: 1.5; }
        .nav-button { display: block; padding: 18px; background: var(--b); color: #fff; text-decoration: none; border-radius: 12px; font-weight: 700; text-align: center; }

        footer { text-align: center; padding: 50px 20px; background: #00153D; color: rgba(255,255,255,0.5); font-size: 13px; line-height: 1.8; } .footer-info { margin-bottom: 15px; } .footer-info p { margin-bottom: 4px; word-break: keep-all; } .footer-copy { font-size: 12px; color: rgba(255,255,255,0.3); }

       /* [태블릿(패드) 화면 최적화: 768px ~ 1023px] */
@media(min-width: 768px) and (max-width: 1023px) {
    /* 1. 상단 메뉴바 간격 및 글씨 크기 조정 */
    .nav-links { gap: 15px; }
    .nav-links a { font-size: 14px; }
    
    /* 2. 의료진 소개: 모바일처럼 위아래가 아닌, PC처럼 좌우로 배치 */
    .doc-card { flex-direction: row; }
    .doc-img { width: 45%; height: auto; } /* 이미지 비율을 45%로 제한 */
    .doc-info { width: 55%; padding: 30px; }
    
    /* 3. 진료/위치: 좌우로 나란히 배치 */
    .info-location-wrapper { flex-direction: row; gap: 20px; }
    .info-box, .map-wrapper { flex: 1; }
    
    /* 4. 내가 추가한 지도 사진 세로 길이 고정 (너무 길어지는 것 방지) */
    .custom-map { height: 250px; object-fit: cover; }
} @media(min-width: 1024px) {
    .nav-links { gap: 25px; } 
    .nav-links a { font-size: 15px; } 
    .doc-card { flex-direction: row; } 
    .doc-img { width: 40%; height: auto; } 
    .info-location-wrapper { flex-direction: row; } 
    .info-box, .map-wrapper { flex: 1; }
    
    /* 👉 PC 화면에서도 지도 사진 높이가 너무 뚱뚱해지지 않게 제한 */
    .custom-map { height: 300px; object-fit: cover; }
}

/* [모바일 약력 더보기] */
.doc-history-content { overflow: hidden; transition: max-height 0.3s ease; }
.doc-history-content.collapsed { max-height: 120px; position: relative; }
.doc-history-content.collapsed::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 60px; background: linear-gradient(to bottom, rgba(248,246,242,0), rgba(248,246,242,1)); pointer-events: none; }
.btn-more-history { display: none; width: 100%; padding: 12px; background: transparent; border: 1px solid var(--b); color: var(--b); border-radius: 8px; font-weight: 700; margin-top: 15px; cursor: pointer; text-align: center; }
@media (max-width: 767px) { .btn-more-history { display: block; } }
@media (min-width: 768px) { .doc-history-content.collapsed { max-height: none; } .doc-history-content.collapsed::after { display: none; } } </style>
</head>

  function toggleHistory() {

  }function toggleMainAccordion(header) {
        const item = header.parentElement;
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('active'));
        if (!isActive) item.classList.add('active');
    }

    function toggleSubAccordion(header) {
        const item = header.parentElement;
        const isActive = item.classList.contains('active');
        const siblings = item.parentElement.querySelectorAll('.sub-item');
        siblings.forEach(el => el.classList.remove('active'));
        if (!isActive) item.classList.add('active');
    }

    async function loadNaverBlog() {
        const blogId = 'sdpainrehab'; 
        const rssUrl = `https://rss.blog.naver.com/${blogId}.xml`;
        const convertUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        try {
            const response = await fetch(convertUrl);
            const data = await response.json();
            const container = document.getElementById('naver-blog-list');
            if (data.status === 'ok') {
                container.innerHTML = ''; 
                data.items.slice(0, 3).forEach(item => {
                    const cleanDesc = item.description.replace(/<[^>]*>?/gm, '').substring(0, 100) + '...';
                    container.innerHTML += `

                            <p>${cleanDesc}</p>
                        </a>`;
                });

            document.getElementById('naver-blog-list').innerHTML = '<p style="text-align:center;">블로그를 불러올 수 없습니다.</p>';

<script>
document.addEventListener("DOMContentLoaded", function() {
    // 오늘 하루 보지 않기 기억 여부 확인 (localStorage 활용)
    const hidePopupUntil = localStorage.getItem("sd_hide_popup_until");
    const now = new Date().getTime();

    // 설정한 시간이 없거나 저장된 만료 시간이 지났으면 팝업 표시
    if (!hidePopupUntil || now > parseInt(hidePopupUntil)) {
        document.getElementById("popupBanner").style.display = "flex";
    }
});

// 일반 팝업 닫기
function closePopup() {
    document.getElementById("popupBanner").style.display = "none";
}

// 오늘 하루 동안 보지 않기 (24시간 동안 차단 저장)
function closePopupToday() {
    const expires = new Date().getTime() + (24 * 60 * 60 * 1000); // 현재 시간 + 24시간
    localStorage.setItem("sd_hide_popup_until", expires);
    closePopup();
}
</script>
